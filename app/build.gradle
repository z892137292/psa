plugins {
    id 'com.android.application'
}

android {
    namespace 'com.erp.carmusic'
    compileSdk 34

    buildTypes {
        debug {
            // Diagnostic APK can coexist with the installed ERP Music app.
            applicationIdSuffix '.diag'
            manifestPlaceholders = [appLabel: 'ERP媒体诊断（测试）']
        }
        release {
            manifestPlaceholders = [appLabel: 'ERP车机音乐']
        }
    }

    defaultConfig {
        applicationId 'com.erp.carmusic'
        minSdk 28
        targetSdk 28
        versionCode 2
        versionName "0.2.0-media-diagnostic"
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.media:media:1.7.0'
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
}
