plugins {
    id 'com.android.application'
}

android {
    namespace 'com.erp.carmusic'
    compileSdk 34

    buildTypes {
        debug {
            // Diagnostic APK can coexist with the installed ERP Music app.
            applicationIdSuffix '.diag'
            manifestPlaceholders = [appLabel: 'ERP媒体诊断（测试）']
        }
        release {
            manifestPlaceholders = [appLabel: 'ERP车机音乐']
        }
    }

    defaultConfig {
        applicationId 'com.erp.carmusic'
        minSdk 28
        targetSdk 28
        versionCode 3
        versionName "0.2.1-media-diagnostic"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    testOptions { unitTests.includeAndroidResources = true }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.media:media:1.7.0'
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.11.1'
}

// Compile the platform-facing observer against API28 public stubs, not just compileSdk34.
tasks.register('verifyDiagnosticApi28', JavaCompile) {
    dependsOn 'compileDebugJavaWithJavac'
    def api28 = file("${android.sdkDirectory}/platforms/android-28/android.jar")
    source fileTree('src/main/java') {
        include '**/MediaDiagnosticService.java', '**/MediaDiagnosticLog.java', '**/MediaAccessListener.java'
    }
    classpath = files(api28, layout.buildDirectory.dir('intermediates/javac/debug/classes'))
    options.bootstrapClasspath = files(api28, android.bootClasspath.findAll { it.name != 'android.jar' })
    sourceCompatibility = '1.8'
    targetCompatibility = '1.8'
    destinationDirectory = layout.buildDirectory.dir('api28-check')
    doFirst {
        if (!api28.isFile()) throw new GradleException('Install platforms;android-28 for the public API compatibility gate')
    }
}
