name: Build ERP CarMusic

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master", "feature/erp-music-media-diagnostics" ]

concurrency:
  group: erp-media-quality-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Do not let setup-android install its default legacy packages.
      # We install the exact SDK packages needed by this project below.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-28" "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.5"

      - name: Static diagnostic safety gate
        run: python3 tools/check_diagnostics.py

      - name: Compile, API28 compatibility and unit tests
        run: |
          gradle --no-daemon --stacktrace assembleDebug :app:verifyDiagnosticApi28 :app:testDebugUnitTest

      - name: Android lint
        run: |
          gradle --no-daemon :app:lintDebug

      - name: APK SHA-256
        run: |
          apkanalyzer manifest print app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/manifest.xml
          python3 tools/verify_apk.py app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/manifest.xml
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/signature.txt
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app/build/outputs/apk/debug/SHA256SUMS

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ERP-Media-Diagnostic-v0.2.1-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS
            app/build/outputs/apk/debug/manifest.xml
            app/build/outputs/apk/debug/signature.txt
          if-no-files-found: error

      - name: Upload quality evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ERP-Diagnostic-quality-${{ github.sha }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn
